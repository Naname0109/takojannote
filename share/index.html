<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>成績共有 - タコ勝ち麻雀録</title>
  <meta name="theme-color" content="#E2503A">
  <meta name="description" content="タコ勝ち麻雀録のグループ成績を閲覧。">
  <style>
    :root { --primary: #E2503A; --gold: #F2A93B; --rasha: #1E6B52; --bg: #FBF4E4; --ink: #2B2620; --ink2: #8C97A4; --card: #fff; --border: rgba(0,0,0,.06); --plus: #C8842A; --minus: #5E6B79; }
    * { box-sizing: border-box; margin: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif; color: var(--ink); background: var(--bg); line-height: 1.6; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 80px; }
    header { background: var(--rasha); color: #F3EAD7; padding: 0; }
    .header-inner { max-width: 640px; margin: 0 auto; padding: 16px 16px 14px; display: flex; align-items: center; gap: 10px; }
    .header-inner h1 { font-size: 18px; font-weight: 700; flex: 1; margin: 0; }
    .badge { font-size: 11px; padding: 3px 10px; border-radius: 999px; background: rgba(243,234,215,.2); border: 1px solid rgba(243,234,215,.4); white-space: nowrap; }
    .install { background: var(--primary); color: white; padding: 8px 14px; border-radius: 10px; text-decoration: none; font-size: 13px; font-weight: 700; white-space: nowrap; }
    .card { background: var(--card); border-radius: 18px; padding: 16px; margin: 14px 0; border: 1px solid var(--border); box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .group-name { font-size: 20px; font-weight: 700; }
    .meta { font-size: 13px; color: var(--ink2); margin-top: 4px; }
    .table-header { display: flex; align-items: center; padding: 0 4px 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }
    .table-header span { width: 52px; text-align: center; font-size: 11px; color: var(--ink2); }
    .table-header .name-col { flex: 1; width: auto; text-align: left; padding-left: 56px; }
    .member-row { display: flex; align-items: center; padding: 8px 4px; border-bottom: 1px solid rgba(0,0,0,.03); }
    .member-row:last-child { border-bottom: none; }
    .rank-badge { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: white; flex-shrink: 0; }
    .rank-1 { background: var(--gold); }
    .rank-2 { background: #A0A0A0; }
    .rank-3 { background: #CD7F32; }
    .rank-n { background: var(--ink2); }
    .avatar { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: white; margin: 0 6px; flex-shrink: 0; }
    .member-name { flex: 1; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cell { width: 52px; text-align: center; font-size: 12px; flex-shrink: 0; }
    .cell-bold { font-weight: 700; }
    .plus { color: var(--plus); }
    .minus { color: var(--minus); }
    .podium { display: flex; justify-content: space-evenly; align-items: flex-end; padding: 16px 8px; }
    .podium-slot { text-align: center; }
    .podium-slot .rank-badge { margin: 0 auto 6px; width: 26px; height: 26px; font-size: 13px; }
    .podium-slot .avatar { margin: 0 auto 4px; width: 36px; height: 36px; font-size: 16px; }
    .podium-slot .name { font-size: 13px; font-weight: 600; max-width: 80px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin: 0 auto; }
    .podium-slot .pt { font-size: 14px; font-weight: 700; margin-top: 2px; }
    .podium-1 .avatar { width: 44px; height: 44px; font-size: 18px; }
    .empty, .err, .loading { text-align: center; padding: 48px 16px; color: var(--ink2); }
    .err { color: #c62828; }
    .footer { text-align: center; color: var(--ink2); font-size: 12px; padding: 24px 0; }
    .footer a { color: var(--ink2); }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1B1814; --ink: #F3EAD7; --ink2: #8C97A4; --card: #262119; --border: rgba(255,255,255,.06); --plus: #F2C063; --minus: #9FB0C0; }
      header { background: #14382a; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>タコ勝ち麻雀録</h1>
      <span class="badge">閲覧のみ</span>
      <a class="install" href="https://apps.apple.com/app/idTBA">アプリで開く</a>
    </div>
  </header>
  <div class="wrap">
    <main id="main">
      <div class="loading">読み込んでいます…</div>
    </main>
    <div class="footer">
      <a href="../index.html">タコ勝ち麻雀録について</a> ・
      <a href="../privacy.html">プライバシー</a> ・
      <a href="../terms.html">利用規約</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDCwp1x6LYmBu15bD9b4QD8a_DVR6frGfQ",
      authDomain: "takojannote-bbe0e.firebaseapp.com",
      projectId: "takojannote-bbe0e",
      storageBucket: "takojannote-bbe0e.firebasestorage.app",
      messagingSenderId: "265346982286",
      appId: "1:265346982286:web:bfa58a9973a906113304df",
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const params = new URLSearchParams(location.search);
    const id = params.get('id');
    const main = document.getElementById('main');

    if (!id) {
      main.innerHTML = '<div class="empty">共有 ID がありません。<br>アプリのグループ共有画面からリンクを取得してください。</div>';
    } else {
      try {
        const snap = await getDoc(doc(db, 'shared_groups', id));
        if (!snap.exists()) {
          main.innerHTML = '<div class="empty">このグループは見つかりません。<br>リンクの有効期限が切れた可能性があります。</div>';
        } else {
          render(snap.data());
        }
      } catch (e) {
        console.error(e);
        main.innerHTML = '<div class="err">読み込みに失敗しました。<br><small>' + esc(e.message || String(e)) + '</small></div>';
      }
    }

    function esc(s) {
      return (s ?? '').toString().replace(/[<>&"']/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]);
    }

    function fmtPt(pt) {
      return pt > 0 ? '+' + pt : String(pt);
    }

    function avgRank(m) {
      if (!m.games) return 0;
      const rc = m.rank_counts || [];
      let sum = 0;
      for (let i = 0; i < rc.length; i++) sum += (i + 1) * rc[i];
      return sum / m.games;
    }

    function topRate(m) {
      if (!m.games) return 0;
      const rc = m.rank_counts || [];
      return rc.length > 0 ? rc[0] / m.games : 0;
    }

    function rentaiRate(m) {
      if (!m.games) return 0;
      const rc = m.rank_counts || [];
      const top2 = (rc[0] || 0) + (rc[1] || 0);
      return top2 / m.games;
    }

    function pct(v) { return Math.round(v * 100) + '%'; }

    function rankClass(r) {
      if (r === 1) return 'rank-1';
      if (r === 2) return 'rank-2';
      if (r === 3) return 'rank-3';
      return 'rank-n';
    }

    function avatarInitial(name) {
      return (name || '?').charAt(0);
    }

    function intToColor(c) {
      if (!c) return '#888';
      const hex = (c & 0xFFFFFF).toString(16).padStart(6, '0');
      return '#' + hex;
    }

    function ptClass(pt) {
      if (pt > 0) return 'plus';
      if (pt < 0) return 'minus';
      return '';
    }

    function fmtDate(ts) {
      if (!ts) return '';
      const d = ts.toDate ? ts.toDate() : new Date(ts.seconds ? ts.seconds * 1000 : ts);
      const pad = n => String(n).padStart(2, '0');
      return d.getFullYear() + '/' + (d.getMonth() + 1) + '/' + d.getDate() + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
    }

    function render(data) {
      const snap = data.snapshot || {};
      const membersMap = snap.members || {};
      const entries = Object.entries(membersMap)
        .map(([id, m]) => ({ id, ...m }))
        .sort((a, b) => (b.total_calc_points || 0) - (a.total_calc_points || 0));

      const groupName = esc(data.group_name || 'グループ');
      const totalGames = snap.total_games || 0;
      const dateStr = fmtDate(data.published_at);

      let html = '';

      html += '<div class="card">';
      html += '<div class="group-name">' + groupName + '</div>';
      html += '<div class="meta">通算 ' + totalGames + ' 半荘</div>';
      if (dateStr) html += '<div class="meta">更新: ' + esc(dateStr) + '</div>';
      html += '</div>';

      if (entries.length === 0) {
        html += '<div class="empty">まだ対局が記録されていません。</div>';
        main.innerHTML = html;
        return;
      }

      html += '<div class="card">';
      html += '<div class="table-header">';
      html += '<span class="name-col"></span>';
      html += '<span>半荘</span><span>通算pt</span><span>平均着</span><span>トップ率</span><span>連対率</span>';
      html += '</div>';

      entries.forEach((m, i) => {
        const rank = i + 1;
        const pt = m.total_calc_points || 0;
        const ar = avgRank(m);
        const tr = topRate(m);
        const rr = rentaiRate(m);
        const color = intToColor(m.color);

        html += '<div class="member-row">';
        html += '<div class="rank-badge ' + rankClass(rank) + '">' + rank + '</div>';
        html += '<div class="avatar" style="background:' + color + '">' + esc(avatarInitial(m.name)) + '</div>';
        html += '<div class="member-name">' + esc(m.name) + '</div>';
        html += '<div class="cell">' + (m.games || 0) + '</div>';
        html += '<div class="cell cell-bold ' + ptClass(pt) + '">' + fmtPt(pt) + '</div>';
        html += '<div class="cell">' + ar.toFixed(1) + '</div>';
        html += '<div class="cell">' + pct(tr) + '</div>';
        html += '<div class="cell">' + pct(rr) + '</div>';
        html += '</div>';
      });
      html += '</div>';

      if (entries.length >= 2) {
        const top = entries.slice(0, Math.min(3, entries.length));
        html += '<div class="card"><div class="podium">';
        top.forEach((m, i) => {
          const rank = i + 1;
          const pt = m.total_calc_points || 0;
          const color = intToColor(m.color);
          html += '<div class="podium-slot podium-' + rank + '">';
          html += '<div class="rank-badge ' + rankClass(rank) + '">' + rank + '</div>';
          html += '<div class="avatar" style="background:' + color + '">' + esc(avatarInitial(m.name)) + '</div>';
          html += '<div class="name">' + esc(m.name) + '</div>';
          html += '<div class="pt ' + ptClass(pt) + '">' + fmtPt(pt) + '</div>';
          html += '</div>';
        });
        html += '</div></div>';
      }

      main.innerHTML = html;
    }
  </script>
</body>
</html>
